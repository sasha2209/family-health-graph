<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Invitation</title>
<style>
  :root { --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dc;
          --accent: #2f6f62; --accent-ink: #ffffff; --info-bg: #ecf1f8; --info: #3d6191; --high: #b4442f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161715; --surface: #1f201e; --text: #ecebe6; --muted: #a09f98;
      --border: #33342f; --accent: #5fb3a1; --accent-ink: #0d1a17; --info-bg: #1f2a3a; --info: #8fb0e0; --high: #f08a74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.3; }
  .muted { color: var(--muted); font-size: 13px; }
  blockquote { margin: 14px 0; padding: 10px 14px; background: var(--info-bg); border-left: 4px solid var(--info);
               border-radius: 8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 14px; }
  select { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--bg); color: var(--text); margin-top: 4px; }
  ul { padding-left: 18px; margin: 8px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  button { font: inherit; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--border);
           background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #error { color: var(--high); min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="card" id="card"><p class="muted">Loading invitation…</p></div>
  <p class="muted" style="margin-top:14px">Family Health Graph helps families put their health history together so
    everyone can see what's worth discussing with a clinician. It does not diagnose.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = (r) => r.replace(/_/g, " ");
const SHARE = { none: "nothing yet", conditions: "their own health conditions",
                conditions_and_tree: "their own health conditions and the family history they've recorded" };
const RELS = ["mother","father","parent","sister","brother","sibling","daughter","son","child",
  "maternal_grandmother","maternal_grandfather","paternal_grandmother","paternal_grandfather","grandmother","grandfather",
  "granddaughter","grandson","grandchild","maternal_aunt","maternal_uncle","paternal_aunt","paternal_uncle","aunt","uncle",
  "niece","nephew","half_sister","half_brother","cousin","other"];
const inviteToken = location.pathname.split("/").pop();
let token = null;
try { token = localStorage.getItem("fhg_token"); } catch (e) {}

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    ...(token ? { Authorization: "Bearer " + token } : {}) } });
  if (res.status === 204) return null;
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

function done(text) {
  $("card").innerHTML = `<h1>${esc(text)}</h1><div class="row"><a href="/"><button class="primary">Open my family health</button></a></div>`;
}

async function load() {
  let p;
  try { p = await call(`/v1/invites/${encodeURIComponent(inviteToken)}`); }
  catch (e) { $("card").innerHTML = `<h1>This invitation can't be used</h1><p class="muted">${esc(e.message)}. Ask your relative to send a new link.</p>`; return; }
  const who = p.inviter_name ? esc(p.inviter_name) : "A relative";
  $("card").innerHTML = `
    <h1>${who}, your ${esc(label(p.they_are_your))}, invited you to share family health history</h1>
    ${p.message ? `<blockquote>${esc(p.message)}</blockquote>` : ""}
    <p>If you join:</p>
    <ul>
      <li>They will share <strong>${SHARE[p.they_will_share]}</strong> with you.</li>
      <li>You choose what you share with them, and you can change it or unlink at any time.</li>
      <li>What either of you shares is used only for each other's insights. It is never sold or sent to insurers or employers.</li>
    </ul>
    <label for="rel">They are your</label>
    <select id="rel">${RELS.map((r) => `<option value="${r}" ${r === p.they_are_your ? "selected" : ""}>${label(r)}</option>`).join("")}</select>
    <label for="share">You'll share with them</label>
    <select id="share">
      <option value="conditions">My health conditions</option>
      <option value="conditions_and_tree">My conditions and the family history I record</option>
      <option value="none">Nothing for now</option>
    </select>
    <div class="row"><button class="primary" id="accept">Accept and join</button><button id="decline">No thanks</button></div>
    <div id="error"></div>
    <p class="muted">${token ? "You'll join with the account already on this device." : "A private account will be created on this device."}
      Expires ${esc(new Date(p.expires_at).toLocaleDateString())}.</p>`;
  $("accept").onclick = async () => {
    try {
      const r = await call(`/v1/invites/${encodeURIComponent(inviteToken)}/accept`, { method: "POST",
        body: JSON.stringify({ share_level: $("share").value, relationship: $("rel").value }) });
      if (r.token) { token = r.token; try { localStorage.setItem("fhg_token", token); } catch (e) {} }
      done(`You're now linked with your ${label(r.they_are_your)}.`);
    } catch (e) { $("error").textContent = e.message; }
  };
  $("decline").onclick = async () => {
    try { await call(`/v1/invites/${encodeURIComponent(inviteToken)}/decline`, { method: "POST" }); } catch (e) {}
    $("card").innerHTML = "<h1>Invitation declined</h1><p class='muted'>Nothing was shared.</p>";
  };
}
load();
</script>
</body>
</html>
