name: CI

# Every PR: tests + Docker build, a Claude review agent, then a merge agent that merges
# when both pass. See docs/AUTOMATION.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  mobile:
    name: Mobile typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  docker:
    name: Docker image (what Render builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fhg:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name fhg -p 8000:8000 -e FHG_ENCRYPTION_KEY=ci-only-secret-that-is-long-enough-123456 fhg:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/app | grep -q '_expo/static'
          curl -sf localhost:8000/portal | grep -q 'Clinic portal'
          # OCR works inside the image: a photographed lab report is read without AI.
          TOKEN=$(curl -sf -X POST localhost:8000/v1/users | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          python3 -c 'import base64,json; print(json.dumps({"data_base64": base64.b64encode(open("tests/fixtures/documents/lab_report.jpg","rb").read()).decode()}))' > /tmp/doc.json
          curl -sf -X POST localhost:8000/v1/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @/tmp/doc.json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["method"]=="ocr" and any(o["code"]=="hba1c" for o in d["extraction"]["observations"]), d'

  review:
    name: Review agent
    # Ready (non-draft) PRs from this repository by people with write access. Forks never get secrets.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the review agent for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}
            (Family Health Graph: a FastAPI backend in fhg/, an Expo app in mobile/, docs in docs/).
            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the surrounding code as needed.
            Do not change any files.

            Check, in this order:
            1. Correctness: bugs, broken edge cases, API changes the mobile app (mobile/src/lib/api.ts, types.ts) doesn't match.
            2. Health-data privacy and security: data stays encrypted at rest (FieldCipher), nothing identifiable is sent to
               a third party (partners, AI providers) without the user's consent scope, authorization checks on every
               endpoint (users can't read each other's data), audit-log entries for access and changes, input validation.
            3. Tests: new behaviour has tests; nothing was skipped or weakened to pass.
            4. Docs/README updated when behaviour or configuration changes.

            Leave an inline comment for each concrete problem (file and line, what goes wrong, a suggested fix).
            Verdict: "request_changes" only for blocking problems (a bug, a security or privacy issue, data loss,
            missing tests for new logic). Style and small suggestions are never blocking: mention them as non-blocking.
            Otherwise "approve". Keep the summary under 150 words.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"},"blocking_issues":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","blocking_issues"],"additionalProperties":false}'
      - id: verdict
        name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.claude.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out="${OUT:-}"; [ -n "$out" ] || out='{}'
          verdict=$(jq -r 'if .verdict == "approve" then "approve" else "request_changes" end' <<<"$out")
          jq -r --arg v "$verdict" '
            (if $v == "approve" then "### ✅ Review agent: approved" else "### ❌ Review agent: changes requested" end),
            "",
            (.summary // "The review agent did not return a verdict, so nothing will be merged. Check the job log."),
            (if ((.blocking_issues // []) | length) > 0 then "", "**Blocking:**", ((.blocking_issues)[] | "- " + .) else empty end),
            "",
            (if $v == "approve" then "The merge agent merges this PR once all checks pass. Add the `hold` label to stop it." else "Push a fix; the review runs again on every push." end),
            "<!-- fhg-review-agent -->"' <<<"$out" > verdict.md
          cat verdict.md
          gh pr comment "$PR" --edit-last --body-file verdict.md 2>/dev/null || gh pr comment "$PR" --body-file verdict.md
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge agent
    needs: [backend, mobile, docker, review]
    if: needs.review.outputs.verdict == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge when everything passed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft,headRefOid,labels)
          echo "$pr"
          if [ "$(jq -r .state <<<"$pr")" != OPEN ]; then echo "PR is not open"; exit 0; fi
          if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then echo "PR went back to draft"; exit 0; fi
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$SHA" ]; then echo "New commits arrived; their own run decides"; exit 0; fi
          if jq -e '.labels[] | select(.name == "hold")' <<<"$pr" >/dev/null; then echo "On hold"; exit 0; fi
          gh pr merge "$PR" --repo "$REPO" --merge --delete-branch --match-head-commit "$SHA"
