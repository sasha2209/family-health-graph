name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-mar poppler-utils
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  mobile:
    name: Mobile typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  docker:
    name: Docker image (what Render builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fhg:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name fhg -p 8000:8000 -e FHG_ENCRYPTION_KEY=ci-only-secret-that-is-long-enough-123456 fhg:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/app | grep -q '_expo/static'
          curl -sf localhost:8000/portal | grep -q 'Clinic portal'
          # OCR works inside the image: a photographed lab report is read without AI.
          TOKEN=$(curl -sf -X POST localhost:8000/v1/users | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          python3 -c 'import base64,json; print(json.dumps({"data_base64": base64.b64encode(open("tests/fixtures/documents/lab_report.jpg","rb").read()).decode()}))' > /tmp/doc.json
          curl -sf -X POST localhost:8000/v1/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @/tmp/doc.json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["method"]=="ocr" and any(o["code"]=="hba1c" for o in d["extraction"]["observations"]), d'
